  binary_sensor:
    - name: "Alarma de Gas Cocina"
      unique_id: "esp32_gas_001_alerta_manual"
      state_topic: "casa/cocina/gas/alarma"
      availability_topic: "casa/cocina/gas/disponibilidad"
      payload_available: "online"
      payload_not_available: "offline"
      payload_on: "ON"
      payload_off: "OFF"
      device_class: "gas"

    - name: "ESP32 Físico 001 Alarma Preventiva"
      unique_id: "esp32_fisico_001_alarma_preventiva"
      state_topic: "simulacion/esp32-fisico-001/telemetria"
      value_template: "{{ 'ON' if value_json.estado == 'alarma preventiva' else 'OFF' }}"
      payload_on: "ON"
      payload_off: "OFF"
      device_class: "safety"

