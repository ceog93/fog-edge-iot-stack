# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

mqtt:
  sensor:
    - name: "Nivel de Gas Cocina"
      unique_id: "esp32_gas_001_ppm_manual"
      state_topic: "casa/cocina/gas/valor"
      availability_topic: "casa/cocina/gas/disponibilidad"
      payload_available: "online"
      payload_not_available: "offline"
      unit_of_measurement: "ADC"
      state_class: "measurement"
      icon: "mdi:gas-cylinder"

    - name: "ESP32 Físico 001 ADC"
      unique_id: "esp32_fisico_001_adc"
      state_topic: "simulacion/esp32-fisico-001/telemetria"
      value_template: "{{ value_json.adc }}"
      unit_of_measurement: "ADC"
      state_class: measurement

    - name: "ESP32 Físico 001 Estado Sim"
      unique_id: "esp32_fisico_001_estado_sim"
      state_topic: "simulacion/esp32-fisico-001/telemetria"
      value_template: "{{ value_json.estado }}"
      icon: "mdi:shield-alert"

    - name: "Alerta Temprana Origen"
      unique_id: "simulacion_alerta_temprana_origen"
